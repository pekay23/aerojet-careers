name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - name: Install dependencies (frozen lockfile)
        run: bun install --frozen-lockfile
      - name: Run ESLint
        run: bun run --bun lint

  type-check:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - name: Install dependencies (frozen lockfile)
        run: bun install --frozen-lockfile
      - name: Run TypeScript type check
        run: bun run --bun type-check

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint, type-check, test]
    steps:
      - uses: actions/checkout@v4
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - name: Install dependencies (frozen lockfile)
        run: bun install --frozen-lockfile
      - name: Cache Next.js build
        uses: actions/cache@v4
        with:
          path: |
            .next/cache
            .next/static
          key: ${{ runner.os }}-nextjs-${{ hashFiles('package.json', 'bun.lock') }}-${{ github.ref }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('package.json', 'bun.lock') }}-
      - name: Build production bundle
        run: bun run build
        env:
          NODE_ENV: production
          NEXT_PUBLIC_APP_URL: ${{ secrets.NEXT_PUBLIC_APP_URL }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          AUTH_SECRET: ${{ secrets.AUTH_SECRET }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: [lint, type-check]
    steps:
      - uses: actions/checkout@v4
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - name: Install dependencies (frozen lockfile)
        run: bun install --frozen-lockfile
      - name: Run unit tests
        run: bun run test:unit

  dependency-audit:
    name: Dependency Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - name: Install dependencies (frozen lockfile)
        run: bun install --frozen-lockfile
      - name: Run bun audit
        run: bun audit --json > audit-report.json
      - name: Fail on high or critical advisories
        run: |
          if jq -e '.[] | select(.severity == "high" or .severity == "critical")' audit-report.json > /dev/null 2>&1; then
            echo "High/Critical vulnerabilities found:"
            jq -r '.[] | select(.severity == "high" or .severity == "critical") | "- \(.title): \(.severity)"' audit-report.json
            exit 1
          fi
          echo "No high or critical advisories."
      - name: Print audit summary
        run: |
          echo "=== Dependency Audit Summary ==="
          echo "Total advisories: $(jq 'length' audit-report.json 2>/dev/null || echo 'N/A')"
          echo ""
          echo "=== Medium Vulnerabilities ==="
          jq -r '.[] | select(.severity == "medium") | "- \(.title): \(.severity)"' audit-report.json 2>/dev/null || echo "None found"