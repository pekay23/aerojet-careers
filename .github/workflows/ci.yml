name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - name: Install dependencies (frozen lockfile)
        run: bun install --frozen-lockfile
      - name: Run ESLint
        run: bun run --bun lint

  type-check:
    name: Type Check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - name: Install dependencies (frozen lockfile)
        run: bun install --frozen-lockfile
      - name: Run TypeScript type check
        run: bun run --bun type-check

  build:
    name: Build
    runs-on: ubuntu-24.04
    needs: [lint, type-check, test]
    steps:
      - uses: actions/checkout@v4
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - name: Install dependencies (frozen lockfile)
        run: bun install --frozen-lockfile
      - name: Cache Next.js build
        uses: actions/cache@v4
        with:
          path: |
            .next/cache
            .next/static
          key: ${{ runner.os }}-nextjs-${{ hashFiles('package.json', 'bun.lock') }}-${{ github.ref }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('package.json', 'bun.lock') }}-
      - name: Build production bundle
        run: bun run build
        env:
          NODE_ENV: production
          NEXT_PUBLIC_APP_URL: ${{ secrets.NEXT_PUBLIC_APP_URL }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          AUTH_SECRET: ${{ secrets.AUTH_SECRET }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}

  test:
    name: Unit Tests
    runs-on: ubuntu-24.04
    needs: [lint, type-check]
    steps:
      - uses: actions/checkout@v4
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - name: Install dependencies (frozen lockfile)
        run: bun install --frozen-lockfile
      - name: Run unit tests
        run: bun run test:unit

  dependency-audit:
    name: Dependency Audit
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - name: Install dependencies (frozen lockfile)
        run: bun install --frozen-lockfile
      - name: Run bun audit
        # `bun audit` exits 1 whenever any advisory is present. The gate below
        # decides what actually fails the build, so the exit code is ignored.
        # Only production dependencies are audited: the dev tree contains
        # advisories with no patched release (see the //braces-note in
        # package.json) and advisories inside the `vercel` CLI, which is a
        # devDependency and never ships.
        run: bun audit --production --json > audit-report.json || true
      - name: Fail on high or critical advisories
        # `bun audit --json` emits an object keyed by package name, so each
        # package's advisory list sits one level down, in .value[].
        run: |
          HIGH_COUNT=$(jq '[to_entries[].value[] | select(.severity == "high" or .severity == "critical")] | length' audit-report.json)
          if [ "$HIGH_COUNT" -gt 0 ]; then
            echo "::error::High or critical vulnerabilities in production dependencies:"
            jq -r 'to_entries[] | .key as $pkg | .value[] | select(.severity == "high" or .severity == "critical") | "  - $pkg: \(.title) [\(.severity)]"' audit-report.json
            exit 1
          fi
          echo "No high or critical advisories in production dependencies."
      - name: Print audit summary
        run: |
          echo "=== Dependency Audit Summary (production dependencies) ==="
          echo "Advisories: $(jq '[to_entries[].value[]] | length' audit-report.json)"
          echo ""
          jq -r 'to_entries[] | .key as $pkg | .value[] | "  - $pkg: \(.title) [\(.severity)]"' audit-report.json

  preview:
    name: Preview Deploy
    # Previews are for pull requests and for pushes to the dev branch.
    # Production is handled exclusively by deploy.yml, which is gated to a CI
    # run on main. Pull requests from forks are skipped because GitHub
    # withholds repository secrets from them, and a deployment without
    # VERCEL_TOKEN could not succeed anyway.
    if: |
      github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
      || (github.event_name == 'push' && github.ref == 'refs/heads/dev')
    runs-on: ubuntu-24.04
    # Only deploy once the code is known to be sound. A Vercel build fails on a
    # type error anyway, and every failed build burns one of the project's
    # daily deployment allowance.
    needs: [lint, type-check]
    permissions:
      contents: read
      pull-requests: write   # only needed to post the preview URL on a PR
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Vercel CLI
        run: npm install --global vercel@latest
      - name: Deploy preview to Vercel
        id: deploy
        run: |
          set -o pipefail
          vercel deploy --yes --token="$VERCEL_TOKEN" 2>&1 | tee deploy.log
          url="$(grep -Eo 'https://[A-Za-z0-9._-]+\.vercel\.app' deploy.log | tail -n 1)"
          if [ -z "$url" ]; then
            echo "::error::Could not determine the preview URL from the Vercel output"
            exit 1
          fi
          echo "Preview: $url"
          echo "url=$url" >> "$GITHUB_OUTPUT"
      - name: Publish the preview URL on the pull request
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const url = '${{ steps.deploy.outputs.url }}';
            const marker = '<!-- vercel-preview -->';
            const body = `${marker}\n### Vercel Preview\n\n${url}\n`;
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const { data: comments } = await github.rest.issues.listComments({ owner, repo, issue_number });
            const existing = comments.find((c) => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }