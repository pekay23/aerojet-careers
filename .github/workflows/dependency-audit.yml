name: Dependency Audit

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 0 * * 1'

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun audit --json --strict || true
      - run: |
        echo "=== Dependency Audit Summary ==="
        echo "Total advisories: $(bun audit --json | jq 'length' 2>/dev/null || echo 'N/A')"
        echo ""
        echo "=== High/Critical Vulnerabilities ==="
        bun audit --json 2>/dev/null | jq -r '.[] | select(.severity == "high" or .severity == "critical") | "- \(.title): \(.severity)"' || echo "None found"
        echo ""
        echo "=== Medium Vulnerabilities ==="
        bun audit --json 2>/dev/null | jq -r '.[] | select(.severity == "medium") | "- \(.title): \(.severity)"' || echo "None found"
